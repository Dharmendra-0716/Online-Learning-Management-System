<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - LearnHub</title>
    <link rel="stylesheet" href="css/register.css">
</head>

<body>

<div class="register-container">

    <div class="register-card">

        <div class="logo">
            Learn<span>Hub</span>
        </div>

        <h1>Create Account</h1>
        <p class="subtitle">Join LearnHub and start learning</p>

        <form id="registerForm" novalidate>

            <div class="input-group">
                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required>
            </div>

            <p id="formMessage" class="form-message" role="alert" aria-live="polite"></p>

            <button id="registerButton" type="submit">Create Account</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p class="role-info">
            New accounts are created as <strong>Student</strong>.
        </p>

    </div>

</div>

<script src="js/register.js"></script>

</body>
</html>

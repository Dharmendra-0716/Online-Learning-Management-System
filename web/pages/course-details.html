<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Course Details - LearnHub</title>

    <style>
:root{
    --bg:#f4f6fb;
    --surface:#fff;
    --ink:#172033;
    --muted:#6b7890;
    --line:#e7ebf3;
    --primary:#5b4df6;
    --primary2:#806cff;
    --navy:#111827;
    --success:#10b981;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
    margin:0;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 85% 0%,rgba(91,77,246,.08),transparent 25%),
      var(--bg);
}
.container{
    width:min(1180px,calc(100% - 40px));
    margin:0 auto;
    padding:30px 0 70px;
}
.back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:20px;
    color:#5144e9;
    text-decoration:none;
    font-size:14px;
    font-weight:750;
}
.back-btn:hover{color:#382ccf;transform:translateX(-2px)}
.course-hero{
    position:relative;
    overflow:hidden;
    padding:40px;
    min-height:260px;
    border-radius:28px;
    color:#fff;
    background:
      radial-gradient(circle at 90% 20%,rgba(255,255,255,.18),transparent 25%),
      linear-gradient(135deg,#4438d8,#6656f5 55%,#7968ff);
    box-shadow:0 28px 60px rgba(79,67,232,.20);
}
.course-hero:before{
    content:"";
    position:absolute;
    width:250px;height:250px;
    right:-100px;bottom:-140px;
    border:48px solid rgba(255,255,255,.08);
    border-radius:50%;
}
.hero-kicker{
    position:relative;
    z-index:2;
    margin:0 0 12px;
    font-size:11px;
    font-weight:850;
    letter-spacing:.16em;
    color:rgba(255,255,255,.72);
}
.course-title{
    position:relative;
    z-index:2;
    margin:0 0 10px;
    font-size:43px;
    line-height:1.08;
    letter-spacing:-1.4px;
    color:#fff;
}
.instructor{
    position:relative;
    z-index:2;
    display:inline-flex;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.14);
    color:#fff;
    font-size:13px;
    font-weight:700;
}
.description{
    position:relative;
    z-index:2;
    max-width:760px;
    margin:22px 0 0;
    color:rgba(255,255,255,.82);
    font-size:16px;
    line-height:1.7;
}
.card{
    margin-top:20px;
    padding:28px;
    border:1px solid var(--line);
    border-radius:22px;
    background:rgba(255,255,255,.96);
    box-shadow:0 14px 40px rgba(25,35,60,.065);
}
.section-head{
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-bottom:20px;
}
.section-icon{
    width:44px;height:44px;
    flex:0 0 44px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#eeebff;
    color:#5545e8;
    font-size:20px;
}
.section-kicker{
    margin:2px 0 4px;
    color:#6b5cf6;
    font-size:10px;
    font-weight:850;
    letter-spacing:.15em;
}
.section-title{
    margin:0;
    font-size:23px;
    letter-spacing:-.5px;
}
.syllabus{
    padding:19px 20px;
    border:1px solid #e8ebf3;
    border-radius:16px;
    background:#f9faff;
    color:#65738a;
    font-size:15px;
    line-height:1.8;
}
.materials-list,.assignments-list{
    display:flex;
    flex-direction:column;
    gap:13px;
}
.material{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    padding:17px;
    border:1px solid #e7ebf3;
    border-radius:17px;
    background:linear-gradient(180deg,#fff,#fafbfe);
    transition:.2s ease;
}
.material:hover,.assignment-card:hover{
    transform:translateY(-2px);
    border-color:#d9def0;
    box-shadow:0 12px 28px rgba(25,35,60,.08);
}
.material-left{display:flex;align-items:center;gap:14px;min-width:0}
.material-icon{
    width:52px;height:52px;
    flex:0 0 52px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:15px;
    background:linear-gradient(135deg,#f0edff,#e9e5ff);
    font-size:25px;
}
.material-title{margin:0;font-size:16px}
.material-description{margin:5px 0 0;color:#6b7890;font-size:13px}
.material-file{
    margin:6px 0 0;
    color:#96a1b2;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:700px;
}
.download-btn{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:11px 16px;
    border-radius:11px;
    color:#fff;
    text-decoration:none;
    background:linear-gradient(135deg,#5144e9,#6b59f7);
    font-size:13px;
    font-weight:750;
    box-shadow:0 8px 18px rgba(91,77,246,.18);
}
.download-btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(91,77,246,.24)}
.assignment-card{
    padding:22px;
    border:1px solid #e7ebf3;
    border-radius:18px;
    background:linear-gradient(180deg,#fff,#fafbfe);
    transition:.2s ease;
}
.assignment-title{margin:0 0 7px;font-size:19px}
.assignment-description{margin:0 0 15px;color:#6b7890;line-height:1.6}
.assignment-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
}
.assignment-meta span{
    padding:7px 10px;
    border:1px solid #e6eaf2;
    border-radius:999px;
    background:#f6f8fc;
    color:#5d6b80;
    font-size:12px;
}
.submission-form{
    margin-top:16px;
    padding:17px;
    border:1px solid #e7ebf3;
    border-radius:16px;
    background:#fafbfe;
}
.submission-form input[type=file]{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:1px dashed #cdd5e3;
    border-radius:11px;
    background:#fff;
    color:#637087;
}
.submit-btn{
    border:0;
    padding:11px 16px;
    border-radius:11px;
    color:#fff;
    background:linear-gradient(135deg,#0ea875,#18b981);
    font-weight:750;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(16,185,129,.16);
}
.submit-btn:hover{transform:translateY(-1px)}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.submission-message{margin-top:10px;font-size:13px;font-weight:700}
.submission-status{margin-top:12px!important}
.loading,.empty,.error{
    padding:30px;
    text-align:center;
    border-radius:16px;
}
.loading{color:#75839a;background:#fafbfe}
.empty{color:#8793a5;background:#f8f9fc;border:1px dashed #dfe4ed}
.error{color:#b91c1c;background:#fff6f6;border:1px solid #fee2e2}
.submission-notice{padding:13px 15px;border-radius:12px;font-size:12px}.pending-notice{background:#f8fafc;color:#68768b;border:1px solid #e7ebf3}.submitted-notice{padding:15px;background:#effcf6;border:1px solid #c9f1dd;border-radius:14px}.submission-heading{display:block;color:#087f5b;font-size:14px;margin-bottom:8px}.submitted-notice div{color:#536176;font-size:12px;margin-top:6px}.submitted-notice .marks{color:#172033;font-weight:750;margin-top:10px}@media(max-width:700px){
    .container{width:min(100% - 24px,1180px);padding-top:18px}
    .course-hero{padding:28px 24px;min-height:230px}
    .course-title{font-size:32px}
    .card{padding:20px}
    .material{align-items:flex-start;flex-direction:column}
    .download-btn{width:100%}
    .material-file{max-width:calc(100vw - 100px)}
}
</style>

</head>


<body>


<div class="container">

    <a href="student-dashboard.html#coursesSection" class="back-btn">← Back to My Courses</a>

<section class="course-hero">
    <p class="hero-kicker">COURSE OVERVIEW</p>

    <h1 class="course-title" id="courseTitle">
        Loading...
    </h1>

    <div class="instructor" id="instructor">
        Loading instructor...
    </div>

    <p class="description" id="description">
        Loading course description...
    </p>

    <div style="margin-top:24px; position:relative; z-index:2;">

        <button
            type="button"
            id="enrollButton"
            class="submit-btn"
            style="
                background:#fff;
                color:#5144e9;
                box-shadow:none;
                padding:12px 20px;
            "
            onclick="enrollInCourse()">

            🎓 Enroll Now

        </button>

        <div
            id="enrollmentMessage"
            style="
                margin-top:10px;
                font-size:13px;
                font-weight:700;
            ">
        </div>

    </div>

</section>

    <section class="card">
        <div class="section-head">
            <div class="section-icon">📚</div>
            <div>
                <p class="section-kicker">WHAT YOU'LL LEARN</p>
                <h2 class="section-title">Course Syllabus</h2>
            </div>
        </div>
        <div class="syllabus" id="syllabus">Loading syllabus...</div>
    </section>

    <section class="card">
        <div class="section-head">
            <div class="section-icon">📁</div>
            <div>
                <p class="section-kicker">LEARNING RESOURCES</p>
                <h2 class="section-title">Learning Materials</h2>
            </div>
        </div>
        <div id="materialsContainer" class="materials-list">
            <div class="loading">Loading learning materials...</div>
        </div>
    </section>

    <section class="card">
        <div class="section-head">
            <div class="section-icon">📝</div>
            <div>
                <p class="section-kicker">YOUR WORK</p>
                <h2 class="section-title">Assignments</h2>
            </div>
        </div>
        <div id="assignmentsContainer" class="assignments-list">
            <div class="loading">Loading assignments...</div>
        </div>
    </section>

</div>


<script>


/* ================= GET COURSE ID ================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const courseId =
    params.get("courseId");

let currentAssignments = [];


/* ================= START ================= */

if (!courseId) {

    document.getElementById(
        "courseTitle"
    ).textContent =
        "Course not found";

    document.getElementById(
        "description"
    ).textContent =
        "No course ID was provided.";

} else {

    loadCourse();

    loadMaterials();

    loadAssignments();

}


/* ================= LOAD COURSE ================= */

async function loadCourse() {

    try {

        const response =
            await fetch(
                "/lms/courses?courseId=" +
                encodeURIComponent(courseId)
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load course."
            );

        }


        const course =
            await response.json();


        document.getElementById(
            "courseTitle"
        ).textContent =
            course.title ||
            "Course";


        document.getElementById(
            "instructor"
        ).textContent =
            "Instructor: " +
            (course.instructorName ||
             "Not assigned");


        document.getElementById(
            "description"
        ).textContent =
            course.description ||
            "No description available.";


        document.getElementById(
            "syllabus"
        ).textContent =
            course.syllabus ||
            "No syllabus available.";


    } catch (error) {

        console.error(error);

        document.getElementById(
            "courseTitle"
        ).textContent =
            "Unable to load course";


        document.getElementById(
            "description"
        ).textContent =
            "There was a problem loading this course.";

    }

}

/* ================= ENROLL IN COURSE ================= */

async function enrollInCourse() {

    const button =
        document.getElementById("enrollButton");

    const message =
        document.getElementById("enrollmentMessage");

    if (!courseId) {

        message.textContent =
            "❌ Course ID is missing.";

        return;
    }

    button.disabled = true;
    button.textContent = "Enrolling...";
    message.textContent = "";

    try {

        const response =
            await fetch("/lms/enroll", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded"
                },

                body:
                    "courseId=" +
                    encodeURIComponent(courseId)
            });


        const result =
            await response.json();


        if (response.ok) {

            message.textContent =
                "✅ " + result.message;

            button.textContent =
                "✅ Enrolled";

            button.disabled = true;

            setTimeout(() => {

                window.location.href =
                    "student-dashboard.html#coursesSection";

            }, 1200);

            return;
        }


        if (response.status === 409) {

            message.textContent =
                "ℹ️ " + result.message;

            button.textContent =
                "✅ Already Enrolled";

            button.disabled = true;

            return;
        }


        message.textContent =
            "❌ " +
            (result.message ||
             "Unable to enroll in this course.");

        button.disabled = false;
        button.textContent =
            "🎓 Enroll Now";


    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ Something went wrong. Please try again.";

        button.disabled = false;
        button.textContent =
            "🎓 Enroll Now";
    }
}


/* ================= LOAD MATERIALS ================= */

async function loadMaterials() {

    const container =
        document.getElementById(
            "materialsContainer"
        );


    try {

        const response =
            await fetch(
                "/lms/materials?courseId=" +
                encodeURIComponent(courseId)
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load materials."
            );

        }


        const materials =
            await response.json();


        console.log(
            "Materials:",
            materials
        );


        /* No materials */

        if (!materials ||
            materials.length === 0) {

            container.innerHTML = `

                <div class="empty">

                    📂 No learning materials
                    have been uploaded yet.

                </div>

            `;

            return;

        }


        let html = "";


        materials.forEach(
            material => {

                const icon =
                    getMaterialIcon(
                        material.materialType,
                        material.fileName
                    );


                html += `

                    <div class="material">


                        <div class="material-left">


                            <div class="material-icon">

                                ${icon}

                            </div>


                            <div>

                                <h3
                                    class="material-title">

                                    ${escapeHtml(
                                        material.title
                                    )}

                                </h3>


                                <p
                                    class="material-description">

                                    ${escapeHtml(
                                        material.description ||
                                        "Learning material"
                                    )}

                                </p>


                                <p
                                    class="material-file">

                                    📄
                                    ${escapeHtml(
                                        material.fileName ||
                                        "File"
                                    )}

                                </p>


                            </div>


                        </div>


                        <a
                            class="download-btn"
                            href="/lms/download-material?materialId=${material.materialId}">

                            ⬇ Download

                        </a>


                    </div>

                `;

            }
        );


        container.innerHTML =
            html;


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="error">

                ❌ Unable to load learning materials.

            </div>

        `;

    }

}


/* ================= LOAD ASSIGNMENTS ================= */

async function loadAssignments() {

    const container =
        document.getElementById("assignmentsContainer");

    try {

        const response =
            await fetch(
                "/lms/assignments?courseId=" +
                encodeURIComponent(courseId)
            );

        if (!response.ok) {
            throw new Error("Unable to load assignments.");
        }

        const assignments =
            await response.json();

        currentAssignments = assignments;

        if (!assignments ||
            assignments.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    📝 No assignments have been created yet.
                </div>
            `;

            return;
        }

        let html = "";

        assignments.forEach(assignment => {

            const dueDate =
                assignment.dueDate
                    ? new Date(assignment.dueDate).toLocaleString()
                    : "Not specified";

            html += `
                <div class="assignment-card">

                    <h3 class="assignment-title">
                        ${escapeHtml(assignment.title || "Assignment")}
                    </h3>

                    <p class="assignment-description">
                        ${escapeHtml(
                            assignment.description ||
                            "No description provided."
                        )}
                    </p>

                    <div class="assignment-meta">

                        <span>
                            📅 Due:
                            ${escapeHtml(dueDate)}
                        </span>

                        <span>
                            🎯 Max Marks:
                            ${escapeHtml(
                                String(assignment.maxMarks ?? 100)
                            )}
                        </span>

                    </div>

                    <form
                        class="submission-form"
                        data-assignment-id="${assignment.assignmentId}"
                        enctype="multipart/form-data">

                        <input
                            type="file"
                            name="file"
                            required>

                        <button
                            type="submit"
                            class="submit-btn">

                            📤 Submit Assignment

                        </button>

                        <div class="submission-message"></div>

                        <div
                            class="submission-status"
                            id="submission-status-${assignment.assignmentId}"
                            style="margin-top:12px;">
                        </div>

                    </form>

                </div>
            `;

        });

        container.innerHTML = html;

        /* Load each student's existing submission status */
        assignments.forEach(assignment => {

           loadMySubmission(
    assignment.assignmentId,
    assignment.dueDate
);

        });

        // Connect every assignment form to the real Java servlet.
        document
            .querySelectorAll(".submission-form")
            .forEach(form => {

                form.addEventListener(
                    "submit",
                    submitAssignment
                );

            });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">
                ❌ Unable to load assignments.
            </div>
        `;

    }

}


/* ================= SUBMIT ASSIGNMENT ================= */

async function submitAssignment(event) {

    event.preventDefault();

    const form = event.currentTarget;

    const assignmentId =
        form.dataset.assignmentId;

    const fileInput =
        form.querySelector('input[type="file"]');

    const button =
        form.querySelector(".submit-btn");

    const message =
        form.querySelector(".submission-message");

    if (!fileInput.files.length) {

        message.textContent =
            "Please select a file.";

        return;
    }

    const formData =
        new FormData();

    formData.append(
        "assignmentId",
        assignmentId
    );

    formData.append(
        "file",
        fileInput.files[0]
    );

    button.disabled = true;
    button.textContent = "Submitting...";
    message.textContent = "";

    try {

        const response =
            await fetch(
                "/lms/submit-assignment",
                {
                    method: "POST",
                    body: formData
                }
            );

        const result =
            await response.json();

        if (!response.ok) {
            throw new Error(
                result.message ||
                "Submission failed."
            );
        }

        message.textContent =
    "✅ " + result.message;

const updatedAssignment =
    currentAssignments.find(
        assignment =>
            String(assignment.assignmentId) ===
            String(assignmentId)
    );

loadMySubmission(
    assignmentId,
    updatedAssignment
        ? updatedAssignment.dueDate
        : null
);

    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ " + error.message;

        button.disabled = false;
        button.textContent =
            "📤 Submit Assignment";

    }

}



/* ================= LOAD MY SUBMISSION ================= */

async function loadMySubmission(assignmentId, dueDate) {

    const container =
        document.getElementById(
            "submission-status-" + assignmentId
        );

    const form =
        document.querySelector(
            `.submission-form[data-assignment-id="${assignmentId}"]`
        );

    if (!container || !form) {
        return;
    }

    const fileInput =
        form.querySelector('input[type="file"]');

    const button =
        form.querySelector(".submit-btn");

    try {

        const response =
            await fetch(
                "/lms/my-submission?assignmentId=" +
                encodeURIComponent(assignmentId)
            );

        if (!response.ok) {

            throw new Error(
                "Unable to load submission status."
            );
        }

        const submission =
            await response.json();


        /*
         * ================= CHECK DUE DATE =================
         */

        const now = new Date();
        const deadline = new Date(dueDate);

        const deadlinePassed =
            dueDate &&
            now >= deadline;


        /*
         * ================= NO SUBMISSION =================
         */

        if (!submission) {

            if (deadlinePassed) {

                fileInput.disabled = true;
                button.disabled = true;
                button.textContent = "🔒 Closed";

                container.innerHTML = `
                    <div class="submission-notice"
                         style="
                            background:#fff7ed;
                            color:#c2410c;
                            border:1px solid #fed7aa;
                         ">
                        🔒 Submission Closed
                        <div>
                            The due date has passed.
                        </div>
                    </div>
                `;

            } else {

                container.innerHTML = `
                    <div class="submission-notice pending-notice">
                        📭 You have not submitted this assignment yet.
                    </div>
                `;
            }

            return;
        }


        /*
         * ================= GRADED =================
         */

        const isGraded =
            submission.marks !== null &&
            submission.marks !== undefined;


        if (isGraded) {

            fileInput.disabled = true;
            button.disabled = true;
            button.textContent = "🔒 Locked";

            const feedback =
                submission.feedback
                    ? escapeHtml(submission.feedback)
                    : "No feedback yet.";

            container.innerHTML = `
                <div class="submission-notice submitted-notice">

                    <strong class="submission-heading">
                        ✅ Assignment Completed
                    </strong>

                    <div>
                        📄 File:
                        ${escapeHtml(
                            submission.fileName ||
                            "Submitted file"
                        )}
                    </div>

                    <div>
                        🕒 Submitted:
                        ${escapeHtml(
                            submission.submittedAt || ""
                        )}
                    </div>

                    <div class="marks">
                        🎯 Marks:
                        ${escapeHtml(
                            String(submission.marks)
                        )}
                    </div>

                    <div>
                        💬 Feedback:
                        ${feedback}
                    </div>

                    <div style="
                        margin-top:10px;
                        color:#087f5b;
                        font-weight:bold;
                    ">
                        🔒 Submission Locked
                    </div>

                </div>
            `;

            return;
        }


        /*
         * ================= SUBMITTED + DEADLINE PASSED =================
         */

        if (deadlinePassed) {

            fileInput.disabled = true;
            button.disabled = true;
            button.textContent = "🔒 Closed";

            container.innerHTML = `
                <div class="submission-notice submitted-notice">

                    <strong class="submission-heading">
                        📤 Assignment Submitted
                    </strong>

                    <div>
                        📄 File:
                        ${escapeHtml(
                            submission.fileName ||
                            "Submitted file"
                        )}
                    </div>

                    <div>
                        🕒 Submitted:
                        ${escapeHtml(
                            submission.submittedAt || ""
                        )}
                    </div>

                    <div style="
                        margin-top:10px;
                        color:#c2410c;
                        font-weight:bold;
                    ">
                        🔒 Submission Closed
                    </div>

                    <div style="
                        margin-top:5px;
                        color:#64748b;
                    ">
                        The due date has passed, so this submission
                        cannot be changed.
                    </div>

                </div>
            `;

            return;
        }


        /*
         * ================= SUBMITTED + BEFORE DEADLINE =================
         *
         * Student can edit the submission.
         */

        button.textContent =
            "✏️ Edit Submission";

        fileInput.disabled = false;
        button.disabled = false;

        container.innerHTML = `
            <div class="submission-notice submitted-notice">

                <strong class="submission-heading">
                    📤 Assignment Submitted
                </strong>

                <div>
                    📄 Current File:
                    ${escapeHtml(
                        submission.fileName ||
                        "Submitted file"
                    )}
                </div>

                <div>
                    🕒 Submitted:
                    ${escapeHtml(
                        submission.submittedAt || ""
                    )}
                </div>

                <div style="
                    margin-top:10px;
                    color:#087f5b;
                    font-weight:bold;
                ">
                    ✏️ You can edit your submission
                    until the due date.
                </div>

            </div>
        `;

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div style="
                padding:12px;
                background:#fef2f2;
                color:#dc2626;
                border-radius:8px;
                font-size:12px;
            ">
                ❌ Unable to load submission status.
            </div>
        `;
    }
}

/* ================= MATERIAL ICON ================= */


function getMaterialIcon(
    materialType,
    fileName
) {

    const type =
        (
            materialType ||
            fileName ||
            ""
        ).toLowerCase();


    if (type.includes("pdf")) {

        return "📕";

    }


    if (
        type.includes("ppt") ||
        type.includes("presentation")
    ) {

        return "📊";

    }


    if (
        type.includes("doc") ||
        type.includes("word")
    ) {

        return "📘";

    }


    if (
        type.includes("txt")
    ) {

        return "📄";

    }


    return "📁";

}


/* ================= ESCAPE HTML ================= */

function escapeHtml(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
